<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Guitar Tab Library → TabShelf</title>
  <!-- La vecchia Guitar Tab Library è stata sostituita da TabShelf: questa pagina esiste solo per i vecchi segnalibri. -->
  <meta http-equiv="refresh" content="2; url=../tabshelf/index.html">
  <style>
    body { font: 16px/1.5 "Segoe UI", system-ui, sans-serif; background: #f6f5f2; color: #1f2328; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    main { text-align: center; padding: 24px; }
    a { color: #9c4c1e; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <p>Guitar Tab Library è stata sostituita da <strong>TabShelf</strong>.</p>
    <p><a href="../tabshelf/index.html">Apri TabShelf</a></p>
  </main>
  <script>
    // Toglie il vecchio service worker di questa cartella e le sue cache ("gtl-"), poi va su TabShelf.
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs
            .filter((r) => new URL(r.scope).pathname.endsWith('/apps/tablature/'))
            .map((r) => r.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter((k) => k.startsWith('gtl-')).map((k) => caches.delete(k)));
        }
      } catch (e) { /* niente: il reindirizzamento avviene comunque */ }
      location.replace('../tabshelf/index.html');
    })();
  </script>
</body>
</html>
