<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toolbox Alessandro</title>
<meta name="description" content="Raccolta personale di strumenti per i miei hobby: audiolibri, chitarra, film e utility.">
<meta name="theme-color" id="theme-color" content="#f6f5f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Toolbox">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<script>
  /* Applica subito il tema salvato, per evitare il "lampo" di colore al caricamento */
  try{var t=localStorage.getItem("toolbox.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}
</script>
<link rel="stylesheet" href="assets/css/home.css">
<script src="assets/js/apps.js" defer></script>
<script src="assets/js/home.js" defer></script>
</head>
<body>
<header class="home-header">
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/><path d="M10 13v2h4v-2"/></svg>
      </div>
      <span class="brand-name">Toolbox Alessandro</span>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="btn-theme" type="button" title="Tema" aria-label="Tema"></button>
      <button class="btn-install" id="btn-install" type="button" hidden title="Installa come app su questo dispositivo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        Installa
      </button>
    </div>
  </div>
</header>

<main id="main">
  <div class="wrap">
    <section id="featured-section" class="block" aria-labelledby="featured-title" hidden>
      <div class="section-head">
        <h2 id="featured-title">In evidenza</h2>
      </div>
      <nav class="app-grid featured" id="featured-grid" aria-label="Applicativi in evidenza"></nav>
    </section>

    <section class="block" aria-labelledby="apps-title">
      <div class="section-head">
        <h2 id="apps-title">Tutti gli strumenti</h2>
        <span id="app-count"></span>
      </div>
      <div class="filters" id="filters" role="toolbar" aria-label="Filtra per categoria"></div>
      <nav class="app-grid" id="app-grid" aria-label="Applicativi disponibili"></nav>
      <noscript><p>Per usare Toolbox Alessandro è necessario attivare JavaScript.</p></noscript>
    </section>
  </div>
</main>

<footer class="home-footer">
  <div class="wrap">
    <details class="logbook">
      <summary>Registro delle versioni</summary>
      <ul id="changelog-list"></ul>
    </details>
    <span>Toolbox Alessandro</span>
  </div>
</footer>
</body>
</html>
